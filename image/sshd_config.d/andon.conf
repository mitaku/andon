# sshd のセッションに image の環境を渡す（image/Dockerfile が /etc/ssh/sshd_config.d/ に焼く）。
# sshd は image の ENV を引き継がない。渡さないと、ssh のシェルにも、Herdr App が SSH 越しに起こす
# herdr-core serve とそこから起きる端末にも、~/.local/bin（claude・hc）と aqua の道具が見えない。
# 値は image/Dockerfile の ENV（HOME 以外）と同じ。compose が environment で上書きするもの（AQUA_GLOBAL_CONFIG）は
# compose の値。ずれないことは tests/sshd-env.sh（静的）と tests/image.sh（ssh と docker exec の env を比べる）が見る。
# **1行にまとめる**。sshd_config は同じキーワードの最初の値しか使わないので、SetEnv を複数行に分けると2行目以降が黙って無視される。
SetEnv PATH=/opt/andon-home/.local/bin:/opt/andon-home/.local/share/aquaproj-aqua/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=en_US.UTF-8 SHELL=/bin/bash AQUA_ROOT_DIR=/opt/andon-home/.local/share/aquaproj-aqua AQUA_GLOBAL_CONFIG=/opt/andon-local/aqua.yaml:/opt/andon-aqua/aqua.yaml AQUA_POLICY_CONFIG=/opt/andon-aqua/aqua-policy.yaml GHQ_ROOT=/workspace/.ghq CLAUDE_CODE_NO_FLICKER=1 ENABLE_TOOL_SEARCH=auto PLAYWRIGHT_BROWSERS_PATH=/opt/andon-home/.cache/ms-playwright CLAUDE_CONFIG_DIR=/opt/andon-home/.claude
