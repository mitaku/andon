name: issue
title: 課題
source: ledger.md（Status rules・Questions）・worker skill §2〜§7・ADR-0017 決めたこと 4 の (1)・15。andon issue … は、ここに無い移り方（今の status から打てないサブコマンド）を断る（by が kanban の移り方は kanban を直に打つもので、断らない）。記録は台帳で、dispatcher の控えに項目を持たない
states:
  - id: queued
    title: 待つ課題がある（queued）
  - id: todo
    title: 引き取れるのを待つ（todo）
  - id: doing
    title: 担当が働いている（doing）
  - id: review
    title: 返した（review）
  - id: done
    title: 片付けた（done）
transitions:
  - { from: "[*]", to: todo, on: "課題を足した", by: kanban, command: kanban add }
  - { from: "[*]", to: queued, on: "after つきで課題を足した", by: kanban, command: kanban add }
  - { from: queued, to: todo, on: "待つ課題が全部 done になった", by: kanban, command: kanban done }
  - { from: todo, to: doing, on: "担当を起動した（§7.2 #10）", by: ai, command: andon issue start, once: true }
  - { from: todo, to: todo, on: "人の課題（who: person）に問いを置いた（ask-one-by-one skill §3）", by: ai, command: andon issue ask }
  - { from: doing, to: doing, on: "報告・レビュー依頼・候補の一覧・問いを書いた", by: ai, command: andon issue report・review-request・candidates・ask }
  - { from: doing, to: review, on: "確かめて返した", by: ai, command: andon issue ready }
  - { from: doing, to: review, on: "Chief Engineer・トリアージが返した", by: kanban, command: kanban review }
  - { from: review, to: review, on: "ゲートが人の判断を問うた・片付けそこねた（from: gate）", by: machine, command: andon issue ask }
  - { from: review, to: doing, on: "直しが届いた", by: kanban, command: kanban start }
  - { from: review, to: done, on: "マージのあと片付けた", by: machine, command: andon issue finish }
  - { from: review, to: done, on: "PR の無い課題（調べる課題・トリアージ・文書なしの返し）を読んで片付けた", by: ai, command: andon issue finish }
  - { from: queued, to: done, on: "やめる（人の go）", by: ai, command: andon issue finish }
  - { from: todo, to: done, on: "やめる（人の go）", by: ai, command: andon issue finish }
  - { from: doing, to: done, on: "やめる（人の go）・review を通らずに人がマージした", by: ai, command: andon issue finish }
  - { from: done, to: "[*]", on: "終わり", by: kanban }
