name: idle
title: 枠の空き
source: dispatcher.md §2.13・ADR-0047 決めたこと 3〜12・17。kanban ごと。idle_minutes（既定 15 分）おきに枠を数え、前の回も今の回も枠が 1 つ以上空いていたら、トリアージと振り返りのルーチンを線の上で、idle_hours を持つルーチンを時間の上で、空いた枠の数まで撃ち、通知 idle を積む
states:
  - id: unknown
    title: 前の回の結果が無い（初めて見る・起動し直した・留守・数えられない・idle_minutes が 0）
  - id: looked
    title: 前の回の結果を控えた（枠が空いていたか・起動できる課題の id・知らせた id・lint の印）
    record: dispatcher:Idle
transitions:
  - { from: "[*]", to: unknown, on: "dispatcher が kanban を回り始めた", by: machine, command: andon dispatcher run }
  - { from: unknown, to: looked, on: "見る時刻が来た。枠を数えて控えるだけ（撃たない・積まない）", by: machine }
  - { from: looked, to: looked, on: "見る時刻が来た。前の回も今の回も枠が空いていて、間が 2 倍を超えていなければ、ルーチンを撃ち、起動されないまま残った課題・撃ったルーチン・新しい lint の problem のどれかがあれば idle を Chief of Staff に届ける（§7.2 #28）", by: machine }
  - { from: looked, to: unknown, on: "Chief of Staff の留守・枠を数えられない・idle_minutes が 0（知らせた id と lint の印は残す）", by: machine }
