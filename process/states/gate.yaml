name: gate
title: gate とマージ
source: dispatcher.md §5（P6a）・§3.2・contract.md §7・ADR-0010 決めたこと 1・ADR-0017 決めたこと 4 の (5)・5・6。andon issue merge の記録（<slug>.merge.json。書き手は merge だけ）の 1 件（課題ごと。review に入った log.jsonl の行を Row に持つ）が Decision・Merged・Wait・Approved で状態を持つ（Retries は base が動いたか必須の check で断られたマージを打ち直した回数。Polled は approve・needs_human を決めたあと PR の head を最後に聞いた時刻）。dispatcher は review の課題ごとに merge を打ち、返った通知を積むだけ。gh の上限の待ちは kanban ごとなので dispatcher の控えに残す
states:
  - id: waiting
    title: 待つ（review に入った行ごと。gate を回す。Row が今の行で Decision が空）
    record: merge:Row
  - id: checks-pending
    title: GitHub の checks を待つ（gate が wait を返した head を記録する。その head の checks が走っている・1つも無く待ち時間の内の間は gate を回さない）
    record: merge:Wait
  - id: rate-limited
    title: gh の上限が戻るのを待つ（gate が gh の rate limit で落ちた。gh api rate_limit の reset と、続けて落ちるたびに倍にする待ち〈1分から〉の遅いほうまで、この kanban の gate を回さない）
    record: [dispatcher:GHReset, dispatcher:GHWait]
  - id: approved
    title: approve（merge auto・委譲の範囲内。記録だけにしてマージに進む。マージの直前に読み直して変わっていれば、base が動いてマージが通らなければ、決めずに回し直す。Approved は回し直しても測り直さない）
    record: merge:Approved
  - id: stuck
    title: approve のまま 10 分たっても決まらない（dispatcher が merge の記録の Approved を読んで通知 `gate` を届けた。同じ Approved では二度届けない）
    record: dispatcher:Stuck
  - id: held
    title: approve だがマージしない（merge person・委譲の外。オーナーのマージの見張りへ）
  - id: on-hold
    title: Chief of Staff が止めている（issue.yaml の予約キー hold。gate を回さず GitHub も読まない。判定のあとに止められたら判定を捨てて gate の問いを閉じる。ADR-0056 決めたこと 9）
  - id: fix
    title: fix（理由を担当へ送った）
  - id: needs-human
    title: needs_human（問いを出した）
  - id: merged
    title: マージした
    record: merge:Merged
  - id: finished
    title: 片付けた
positions: [merge:Sha, merge:Decision, merge:Retries, merge:Polled]
transitions:
  - { from: "[*]", to: waiting, on: "review に入った", by: machine }
  - { from: waiting, to: "[*]", on: "PR を出さない課題だった（report.json に pr が無く、commit が既定の branch に入っている。gate を回さず fix も送らない。返ったことは collect が通知 report で届ける）", by: machine, command: andon issue merge }
  - { from: waiting, to: approved, on: "gate を回す（approve・merge auto・委譲の範囲内。§7.2 #4）", by: machine, command: andon issue merge, once: true }
  - { from: waiting, to: held, on: "gate を回す（approve・merge person か委譲の外。§7.2 #4）", by: machine, command: andon issue merge, once: true }
  - { from: waiting, to: fix, on: "gate を回す（fix。理由を担当へ hc send。§7.2 #4）", by: machine, command: andon issue merge, once: true }
  - { from: waiting, to: needs-human, on: "gate を回す（needs_human。問いを出す。§7.2 #4）", by: machine, command: andon issue merge, once: true }
  - { from: waiting, to: checks-pending, on: "gate を回す（wait。PR の head の GitHub の checks が走っている・まだ1つも無い）", by: machine, command: andon issue merge }
  - { from: checks-pending, to: checks-pending, on: "同じ head の checks がまだ走っている・1つも無く github_checks_wait_minutes の内（GraphQL の checks だけを読み、REST を読む gate は回さない）", by: machine }
  - { from: checks-pending, to: waiting, on: "head が動いた・checks が揃った・待ち時間を過ぎた・読めない（その見回りで gate から）", by: machine }
  - { from: waiting, to: rate-limited, on: "gate を回す（gh の rate limit で落ちた。問いにも決めたことにもしない。dispatcher が控えの GHReset・GHWait に書く）", by: machine, command: andon issue merge }
  - { from: rate-limited, to: rate-limited, on: "reset の時刻の前（gate も checks も読まない）", by: machine }
  - { from: rate-limited, to: waiting, on: "reset の時刻を過ぎた（その見回りで gate から）", by: machine }
  - { from: approved, to: merged, on: "マージして片付ける（直前に読み直して判定した head だけ。§7.2 #5）", by: machine, command: andon issue merge, once: true }
  - { from: approved, to: waiting, on: "読み直すと head か checks が替わっていた（次の見回りで gate から）", by: machine }
  - { from: approved, to: waiting, on: "base が動いたか、必須の check がまだ揃わず（the base branch policy prohibits the merge）gh pr merge が通らなかった（Retries を進め、次の見回りで gate から。3 回まで。ADR-0056 決めたこと 12）", by: machine, command: andon issue merge }
  - { from: approved, to: needs-human, on: "gh pr merge が通らず打ち直さない（ほかの失敗・base の動きが 3 回を超えた。問いを出す。§7.2 #5）", by: machine, command: andon issue merge, once: true }
  - { from: approved, to: stuck, on: "10 分たっても決まらない（dispatcher が merge の記録を読んで届ける待ちに 1 回だけ積む。§7.2 #25）", by: machine, once: true }
  - { from: stuck, to: "[*]", on: "merge が回し直して決めた（Approved が消え、dispatcher は Stuck を捨てる）", by: machine, command: andon issue merge }
  - { from: approved, to: "[*]", on: "gh pr merge の前か、打ち直しを待つ間にオーナーがマージしていた（オーナーのマージの見張りへ）", by: machine }
  - { from: merged, to: finished, on: "マージして片付ける（finish は merge の中で打つ。§7.2 #5）", by: machine, command: andon issue merge, once: true }
  - { from: held, to: "[*]", on: "オーナーがマージするか決める", by: person }
  - { from: held, to: waiting, on: "PR の head が判定した head から動いた（merge が課題ごとに1分に1回だけ聞く。その見回りで今の head の gate から）", by: machine, command: andon issue merge }
  - { from: fix, to: "[*]", on: "担当が直して doing に戻った", by: kanban, command: kanban start }
  - { from: needs-human, to: "[*]", on: "オーナーが答えた", by: person }
  - { from: needs-human, to: waiting, on: "PR の head が判定した head から動いた（merge が課題ごとに1分に1回だけ聞き、前の head の gate の問いを閉じる。その見回りで今の head の gate から）", by: machine, command: andon issue merge }
  - { from: waiting, to: on-hold, on: "Chief of Staff が止めている（andon issue hold。gate を回さない。merge は state hold を返す）", by: machine, command: andon issue merge }
  - { from: approved, to: on-hold, on: "approve のあとに止められた（判定を捨て、マージしない。直前の読み直しも止めを見る。ADR-0056 決めたこと 9）", by: machine, command: andon issue merge }
  - { from: held, to: on-hold, on: "approve のあとに止められた（判定を捨てる）", by: machine, command: andon issue merge }
  - { from: needs-human, to: on-hold, on: "needs_human のあとに止められた（判定を捨て、gate の問いを閉じる）", by: machine, command: andon issue merge }
  - { from: on-hold, to: waiting, on: "Chief of Staff が andon issue unhold で外した（次の見回りで今の head の gate から。gate が印を書く）", by: ai, command: andon issue unhold }
  - { from: finished, to: "[*]", on: "終わり", by: machine }
