#cloud-config
# クラウドの VM にセルを1つ立てる雛形。<…> を埋めて VM の user-data に渡す。
# ホストに入れるのは docker と git だけ。ログイン（gh・claude・codex）はセルの中で取る。
# VM に入ったら: git clone <セルの repo> ~/src/<slug>-cell → docker pull（image は Public。login は要らない）
#   → ~/src/<slug>-cell/bin/bootstrap
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
users:
  - default
  - name: <user>
    groups: [docker]
    shell: /bin/bash
    ssh_authorized_keys:
      - <公開鍵>
runcmd:
  - [systemctl, enable, --now, docker]
