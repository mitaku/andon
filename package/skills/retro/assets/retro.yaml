# ルーチン retro の例（retro skill）。
# kanban は git の外なのでパッケージからは降りない。オーナーの go で、Chief of Staff が
# projects/<slug>/kanban/routines/retro.yaml に写す（名前は retro のまま。andon retro collect は routine: retro で前の振り返りを見分ける）。
# 周期は毎朝1回（schedule は config.yaml の timezone で読む）。profile は既定で、Chief of Staff が変えてよい。
# 件数のきっかけもある: 前の振り返りのあとに片付いた担当の課題が project.json の chief_of_staff.retro_every 件（既定 25）になると、dispatcher が数えてこのルーチンを撃つ。
# 止めるときはオーナーが paused: true を書く。手で撃つときは kanban routine run retro。
title: "振り返り（直近 7 日の記録から繰り返しを拾う）"
profile: claude
brief: |
  # 振り返り
  解決すべき問題: 直近 7 日に片付いた課題の記録とオーナーが打った文から、別々に2回以上起きたつまずき（パターン）を拾い、直す先の段と判定を決める。
  /opt/andon/skills/retro/SKILL.md を読み、その手順で `andon retro collect` → パターンを拾う → `andon retro patterns <自分の id> -` →
  `andon retro apply <自分の id> --dry-run` → 報告（andon issue report）→ kanban review。
  守ること: 読むだけ。直さない・PR を出さない・kanban の項目を片付けない（書くのは自分の issues/<id>/library/ と報告）。エージェントを起動しない。
  `andon retro apply` は --dry-run だけ打つ。Chief of Staff へ hc send しない。
  完了条件: `andon retro patterns` が通り、全部のパターンに判定と理由があり（fix は優先の順に並べる）、前の直しの全部に再発の数と見立てがあり、
  `andon retro apply <自分の id> --dry-run` が通る。パターンが無ければ、無いことと読んだ件数を報告に書く。
schedule: "17 8 * * *"
open: 1
