# セルの compose（パッケージの持ち物）。セルの bin/bootstrap がイメージから .andon/compose.yaml に取り出して使う。
# セルの repo では書き換えない。セルに固有のサービスはセルの compose.override.yaml に書く（bootstrap が重ねる）。
# 番号はセルの .env（SSH_PORT・PORTLESS_PORT・FILES_PORT）。ANDON_IMAGE・ANDON_SLUG は bootstrap が渡す。
services:
  dev:
    image: ${ANDON_IMAGE:?bin/bootstrap から起こす}
    # 毎起動、パッケージから配布物を生成し、portless・sshd・dispatcher を起こしてから待つ
    command: ["bash", "-c", "andon boot; exec sleep infinity"]
    # コンテナのホスト名をセルの名前にする（プロンプトと portless の名前に出る）
    hostname: ${ANDON_SLUG:?bin/bootstrap から起こす}
    init: true
    # codex の sandbox（bwrap）は user namespace を作る。docker の既定の seccomp はそれを拒む
    security_opt:
      - seccomp:unconfined
    ports:
      # ssh（herdr の別マシン・portless の LocalForward）。127.0.0.1 にだけ晒す
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    environment:
      # セルの local/aqua.yaml（Dockerfile が /opt/andon-local に写す）をイメージの備品に重ねる
      AQUA_GLOBAL_CONFIG: /opt/andon-local/aqua.yaml:/opt/andon-aqua/aqua.yaml
    volumes:
      - .:/workspace
      # ログインと設定は作り直しても残す（HOME は /opt/andon-home）
      - claude:/opt/andon-home/.claude
      - claude-native:/opt/andon-home/.local/share/claude
      - codex:/opt/andon-home/.codex
      - agents:/opt/andon-home/.agents
      - gh:/opt/andon-home/.config/gh
      # 外の信号の出所のトークン（andon signal auth。ADR-0011 決めたこと 10）
      - signals:/opt/andon-home/.config/andon/signals
      - herdr:/opt/andon-home/.config/herdr
      - herdr-core:/opt/andon-home/.config/herdr-core
      - ssh:/opt/andon-home/.ssh
      - portless:/opt/andon-home/.portless
      - state:/opt/andon-home/.local/state

volumes:
  claude:
  claude-native:
  codex:
  agents:
  gh:
  signals:
  herdr:
  herdr-core:
  ssh:
  portless:
  state:
