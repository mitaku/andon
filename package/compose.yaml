# セルの compose（パッケージの持ち物）。セルの bin/bootstrap がイメージから .andon/compose.yaml に取り出して使う。
# セルの repo では書き換えない。セルに固有のサービスはセルの compose.override.yaml に書く（bootstrap が重ねる）。
# 番号とタイムゾーンはセルの .env（SSH_PORT・PORTLESS_PORT・TRAY_PORT・CELL_TZ）。ANDON_IMAGE・ANDON_SLUG・ANDON_ENTRY は bootstrap が渡す。
services:
  dev:
    image: ${ANDON_IMAGE:?bin/bootstrap から起動する}
    # 毎起動、パッケージから配布物を生成し、portless・ローカルの tray・sshd・dispatcher を起動してから待つ
    command: ["bash", "-c", "andon boot; exec sleep infinity"]
    # コンテナのホスト名をセルの名前にする（プロンプトと portless の名前に出る）
    hostname: ${ANDON_SLUG:?bin/bootstrap から起動する}
    init: true
    # codex の sandbox（bwrap）は user namespace を作る。docker の既定の seccomp はそれを拒む
    security_opt:
      - seccomp:unconfined
    ports:
      # ssh（herdr の別マシン・portless の LocalForward）。127.0.0.1 にだけ晒す
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    environment:
      # セルの入口の形の番号（ADR-0048 決めたこと 3・10）。薄い入口の bin/bootstrap が渡す。分ける前の入口は渡さないので、
      # 新しい image に上げたあとは、どの docker compose もここで止まり、入口を置き換える 1 行（image の名前入り）を文の最後に出す（補間の文は改行を持てない）
      ANDON_ENTRY: "${ANDON_ENTRY:?セルの入口 bin/bootstrap が古い（この image は薄い入口から打つ）。セルの repo で、この文の最後の「: 」のあとを 1 行として打って入口を置き換え、打った command を打ち直す（手を入れていた入口なら先に git diff で見る。docs/operate.md の 4）: docker run --rm ${ANDON_IMAGE} andon cell init --print bin/bootstrap > bin/bootstrap.new && install -m 755 bin/bootstrap.new bin/bootstrap && rm bin/bootstrap.new}"
      # セルの local/aqua.yaml（Dockerfile が /opt/andon-local に写す）をイメージの備品に重ねる
      AQUA_GLOBAL_CONFIG: /opt/andon-local/aqua.yaml:/opt/andon-aqua/aqua.yaml
      # タイムゾーン（IANA の名前）。セルの .env の CELL_TZ で変える。鍵を TZ にしないのは、compose が .env よりホストのシェルの
      # 変数を先に使い、ホストの TZ がセルに入るため。ssh のセッションには sshd が自分の TZ を渡す（boot が sudo 越しに起動し、sudo は TZ を残す）
      TZ: ${CELL_TZ:-Asia/Tokyo}
    volumes:
      - .:/workspace
      # ログインと設定は作り直しても残す（HOME は /opt/andon-home）
      - claude:/opt/andon-home/.claude
      - claude-native:/opt/andon-home/.local/share/claude
      - codex:/opt/andon-home/.codex
      - agents:/opt/andon-home/.agents
      - gh:/opt/andon-home/.config/gh
      # 外の信号の出所のトークン（andon signal auth。ADR-0011 決めたこと 10）
      - signals:/opt/andon-home/.config/andon/signals
      # ダイジェストを送る Slack の bot のトークン（andon digest auth slack。ADR-0044 決めたこと 14）。読み取り専用の signals とは分ける
      - digest:/opt/andon-home/.config/andon/digest
      # Cloudflare の tray の API キー（andon tray auth。ADR-0064 決めたこと 19）。ローカルの tray のデータは state の下
      - tray:/opt/andon-home/.config/andon/tray
      - herdr:/opt/andon-home/.config/herdr
      - herdr-core:/opt/andon-home/.config/herdr-core
      - ssh:/opt/andon-home/.ssh
      - portless:/opt/andon-home/.portless
      - state:/opt/andon-home/.local/state
      # mise が入れた言語の道具と shims（ADR-0063 決めたこと 4・5）。消えてもよいキャッシュで、消しても次に役の端末を起動するときに入れ直す。
      # バージョンの正は案件の repo の mise.toml。mise の cache（~/.cache/mise）は載せない
      - mise:/opt/andon-home/.local/share/mise

volumes:
  claude:
  claude-native:
  codex:
  agents:
  gh:
  signals:
  digest:
  tray:
  herdr:
  herdr-core:
  ssh:
  portless:
  state:
  mise:
