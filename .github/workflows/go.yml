name: go
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o "$RUNNER_TEMP/andon" ./cmd/andon
      - name: tests/andon*.sh
        env:
          ANDON_BIN: ${{ runner.temp }}/andon
        run: |
          set -e
          for f in tests/andon*.sh; do echo "== $f"; bash "$f"; done
