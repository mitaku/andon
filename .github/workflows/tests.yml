name: tests
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  # PR と main の push: image を焼いて検査するだけ。token に packages の書き込みを持たせない。
  # 速くする4つ（docs/image.md の「CI の所要時間」）: andon・kanban を1回だけ焼いて渡す・tests/*.sh を並べる・
  # PR の変更が image に関係しなければ tests/image.sh を飛ばす・文書だけの PR は文書を読む tests/*.sh だけ
  # （job は成功で終わる。main の push では必ず全部走る）
  tests:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the image checks are needed
        id: scope
        run: |
          set -euo pipefail
          # PR の merge commit の1つ目の親が base。PR 以外（main の push）は必ず image まで全部見る
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # rename は元と先の両方を出す（image に入るものを外へ動かしても飛ばさない）
            git diff --name-only --no-renames HEAD^1 HEAD | tee "$RUNNER_TEMP/changed"
            image=$(bash tests/lib/image-scope.sh <"$RUNNER_TEMP/changed")
            docs=$(bash tests/lib/docs-scope.sh <"$RUNNER_TEMP/changed")
          else
            image=true docs=false
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          if [ "$image" != true ]; then
            echo "ANDON_TEST_SKIP=tests/image.sh" >>"$GITHUB_ENV"
            echo "::notice title=tests/image.sh::image に関係する変更が無いので、image の build と runtime の検査を飛ばす"
          fi
          # 文書だけの PR は、変えた文書を読む tests/*.sh だけ（tests/lib/scope.sh。空なら全部）
          if [ "$docs" = true ]; then
            bash tests/lib/scope.sh <"$RUNNER_TEMP/changed" | tee "$RUNNER_TEMP/tests"
            echo "::notice title=tests/*.sh::文書だけの変更なので、文書を読む検査だけを走らせる: $(tr '\n' ' ' <"$RUNNER_TEMP/tests")"
          else
            : >"$RUNNER_TEMP/tests"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go build (andon and kanban for tests/*.sh)
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bin/andon" ./cmd/andon
          go build -ldflags "-X main.version=${GITHUB_SHA::12}" -o "$RUNNER_TEMP/bin/kanban" ./cmd/kanban
          {
            echo "ANDON_BIN=$RUNNER_TEMP/bin/andon"
            echo "KANBAN_BIN=$RUNNER_TEMP/bin/kanban"
          } >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.scope.outputs.image == 'true'
      - name: tests/*.sh (including image build and runtime)
        env:
          ANDON_PUBLIC_DENYLIST_CONTENT: ${{ secrets.ANDON_PUBLIC_DENYLIST }}
          # image の build の apt を runner と同じ Azure の mirror から取る（image/build.sh が APT_MIRROR に渡す）。
          # この job だけ。release の job は既定の archive・security のまま（docs/image.md の「CI の所要時間」）
          ANDON_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
        run: |
          set -e
          if [ -n "$ANDON_PUBLIC_DENYLIST_CONTENT" ]; then
            export ANDON_PUBLIC_DENYLIST="$RUNNER_TEMP/public-denylist"
            printf '%s\n' "$ANDON_PUBLIC_DENYLIST_CONTENT" > "$ANDON_PUBLIC_DENYLIST"
          fi
          mapfile -t tests <"$RUNNER_TEMP/tests"
          bash tests/lib/run-tests.sh "${tests[@]}"
  # PR だけ: 検査がセルの本物（kanban・HOME）を読み書きしないかを、偽のセル（番兵）で回して見る（tests/isolation）。
  # 回す検査は tests/lib/scope.sh --isolation が PR の変更から選ぶ（検査の土台なら全部、tests/ の検査と置き場ならその検査、
  # Go なら go test と smoke.sh）。選ぶものが無ければ回さず、job は成功で終わる（docs/image.md の「検査の隔離」）。
  # image.sh は docker が要るので回さない。main の隔離は週1回の点検 check-isolation が見る
  isolation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide which checks run in the sentinel cell
        id: scope
        run: |
          set -euo pipefail
          # PR の merge commit の1つ目の親が base（tests の job と同じ。rename は元と先の両方）
          git diff --name-only --no-renames HEAD^1 HEAD | bash tests/lib/scope.sh --isolation | tee "$RUNNER_TEMP/isolation"
          if [ -s "$RUNNER_TEMP/isolation" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=tests/isolation::検査の土台・tests/ の検査・Go の変更が無いので、偽のセルでの検査を飛ばす"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: go build (andon and kanban for tests/isolation)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bin/andon" ./cmd/andon
          go build -ldflags "-X main.version=${GITHUB_SHA::12}" -o "$RUNNER_TEMP/bin/kanban" ./cmd/kanban
          {
            echo "ANDON_BIN=$RUNNER_TEMP/bin/andon"
            echo "KANBAN_BIN=$RUNNER_TEMP/bin/kanban"
          } >>"$GITHUB_ENV"
          # tests/isolation は番兵の kanban を PATH の kanban で作る
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: tests/isolation
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          mapfile -t tests <"$RUNNER_TEMP/isolation"
          tests/isolation "${tests[@]}"
  # vX.Y.Z の tag の push だけ: tag の名前と main に含まれる commit かを確かめ、同じ job の中で
  # tests/*.sh（image/build.sh で焼いた andon:test の検査を含む）を通した image を GHCR へ push する。
  # packages: write はこの job だけ（workflow_test.go が確かめる）
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit already on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go build (andon and kanban for tests/*.sh)
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bin/andon" ./cmd/andon
          go build -ldflags "-X main.version=${GITHUB_SHA::12}" -o "$RUNNER_TEMP/bin/kanban" ./cmd/kanban
          {
            echo "ANDON_BIN=$RUNNER_TEMP/bin/andon"
            echo "KANBAN_BIN=$RUNNER_TEMP/bin/kanban"
          } >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: tests/*.sh (including image build and runtime)
        env:
          ANDON_PUBLIC_DENYLIST_CONTENT: ${{ secrets.ANDON_PUBLIC_DENYLIST }}
        run: |
          set -e
          if [ -n "$ANDON_PUBLIC_DENYLIST_CONTENT" ]; then
            export ANDON_PUBLIC_DENYLIST="$RUNNER_TEMP/public-denylist"
            printf '%s\n' "$ANDON_PUBLIC_DENYLIST_CONTENT" > "$ANDON_PUBLIC_DENYLIST"
          fi
          bash tests/lib/run-tests.sh
      - name: Push tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/andon"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag andon:test "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"
