name: tray
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # tray（tray/。ADR-0064）の検査を回す: 型・Workers の検査（workerd の上）・ビルド・端から端の検査・ブラウザの検査。
  # 依存は外から取る npm のコードなので、この job だけで回し、秘密を渡さず、token は読むだけにする。依存は tray/bun.lock から入れ、
  # install のスクリプトは走らせない。Bun と Node のバージョンは mise.toml から読む。tests・release の job では回さない
  # （workflow_test.go が確かめる）。job と check の名前は変えない（gate は PR の head の checks が揃うのを待つ）
  tray:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tool versions (from mise.toml)
        id: tools
        run: |
          set -euo pipefail
          bun=$(sed -n 's/^bun = "\(.*\)"$/\1/p' ../mise.toml)
          node=$(sed -n 's/^node = "\(.*\)"$/\1/p' ../mise.toml)
          [ -n "$bun" ] && [ -n "$node" ] || { echo "::error::mise.toml に bun か node のバージョンが無い"; exit 1; }
          echo "bun=$bun" >>"$GITHUB_OUTPUT"
          echo "node=$node" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Install (from bun.lock)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Workers tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: End-to-end
        run: bun run e2e
      - name: Browser tests (Chromium)
        run: |
          set -euo pipefail
          bunx playwright install --with-deps chromium
          bun run browser
