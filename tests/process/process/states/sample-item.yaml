name: sample-item
title: 見本のもの
source: tests/process.sh の見本（架空）
states:
  - id: waiting
    title: 待ち
    record: sample:Pending
  - id: handed
    title: 渡した
    record: [sample:Coord, sample:Hook]
  - id: done
    title: 確かめた
positions: [sample:LogPos]
transitions:
  - { from: "[*]", to: waiting, on: 通知が積まれた, by: machine }
  - { from: waiting, to: handed, on: "入力欄が空: 渡す", by: machine, command: andon dispatcher, once: true }
  - { from: handed, to: done, on: ack, by: ai }
  - { from: done, to: "[*]", on: 片付けた, by: deck }
